name: BinderOS quality gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r gateway/requirements.txt httpx==0.28.1
      - run: python -m unittest gateway/test_gateway.py gateway/test_benchmark.py
      - name: Reject committed credentials
        run: node scripts/check-secrets.mjs
